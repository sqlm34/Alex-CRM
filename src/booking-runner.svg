<svg xmlns="http://www.w3.org/2000/svg" viewBox="115 30 195 225" role="img" aria-label="A navy blue appliance repair technician in a baseball cap running with a toolbox, viewed from the side"><style>.blue{fill:#193d76}.limb{fill:none;stroke:#193d76;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:11}.ground{stroke:#e3e9f0;stroke-width:2}.body{animation:bounce .6s linear infinite}.leg-a{animation:legA .6s linear infinite;transform-origin:192px 153px}.leg-b{animation:legB .6s linear infinite;transform-origin:192px 153px}.arm{animation:arm .6s ease-in-out infinite;transform-origin:207px 106px}.case{animation:case .6s ease-in-out infinite;transform-origin:257px 153px}.shadow{animation:shadow .3s ease-in-out infinite;transform-origin:210px 244px}.dash{animation:dash .6s linear infinite}.dash.second{animation-delay:-.3s}.dot{animation:dot 1.2s ease-in-out infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-7px)}}
@keyframes legA{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(40deg)}}
@keyframes legB{0%,100%{transform:rotate(40deg)}50%{transform:rotate(-38deg)}}
@keyframes arm{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-26deg)}}
.free-arm{animation:freeArm .6s ease-in-out infinite;transform-origin:202px 107px}
.free-forearm{animation:freeElbow .6s ease-in-out infinite;transform-origin:188px 138px}
@keyframes freeArm{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(32deg)}}
@keyframes freeElbow{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes case{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(9deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.12}50%{transform:scaleX(.8);opacity:.07}}
@keyframes dash{from{transform:translateX(40px);opacity:0}25%{opacity:.65}to{transform:translateX(-75px);opacity:0}}
@keyframes dot{0%,70%,100%{opacity:.2;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
</style>
 
 
